spring:
  config:
    import: "optional:application-local.yml"
  # Google / Microsoft sign-in.
  #
  # THIS FILE IS COMMITTED TO GIT — never put a real client id or secret here.
  # Put them in application-local.yml (gitignored), which is imported above and
  # overrides these placeholders. Anything written literally below is published
  # the moment the repository is pushed.
  #
  # Note that Spring Boot 4 validates every declared registration and refuses to
  # start on a blank client-id ("Client id of registration 'google' must not be
  # empty"), so these must be supplied somewhere before the backend will run.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid, profile, email
          azure:
            client-id: ${MICROSOFT_CLIENT_ID:}
            client-secret: ${MICROSOFT_CLIENT_SECRET:}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Microsoft
        provider:
          azure:
            # "common" accepts any personal or work/school account; set
            # MICROSOFT_TENANT_ID to a tenant GUID to restrict it.
            authorization-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub
            # Required: the "openid" scope makes this an OIDC login, so Spring
            # verifies the ID token's signature. Without a JWK set URI it fails
            # with "missing_signature_verifier" *after* the user has already
            # signed in successfully. Google needs no equivalent here because
            # Spring ships a built-in provider definition for it.
            jwk-set-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/discovery/v2.0/keys
  # Overridable per environment. Local developer values belong in
  # application-local.yml (gitignored), not here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm_spring}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
# Any OpenAI-compatible chat-completions endpoint — this is the whole LLM
# integration surface, so switching providers is configuration, not code.
#
# Defaults now target the local fine-tuned model served by
# Llama3_CRM/scripts/main.py (start it with `python scripts/main.py`). That
# server routes internally: lead scoring runs through the LoRA adapter, the
# other three modules run the base Llama 3.1 8B Instruct.
#
# Port 8001, not 8000: XgBoost/serve_api.py already owns 8000, and
# deal-scoring.base-url below points at it.
#
# api-key stays blank — a self-hosted server needs no bearer token, and
# AiChatClient omits the header entirely when it is empty.
#
# To fall back to a hosted provider, set the three env vars, e.g.
#   AI_BASE_URL=https://api.groq.com/openai/v1
#   AI_MODEL_NAME=llama-3.1-8b-instant
#   AI_API_KEY=<key>
ai:
  base-url: ${AI_BASE_URL:http://localhost:8001/v1}
  model-name: ${AI_MODEL_NAME:crm-llama-3.1-8b-lora}
  # Never commit a real key — set AI_API_KEY, or put it in application-local.yml.
  api-key: ${AI_API_KEY:}
  # Raised from the 30s that suited a hosted API. A local 4-bit 8B generates at
  # roughly 15-30 tok/s on a consumer GPU, and deal analysis asks for ~900
  # tokens of JSON in one reply — at 30s that call times out mid-generation and
  # every deal silently falls through to the heuristic analyser.
  request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:180000}
# The XGBoost deal scorer (XgBoost/serve_api.py). Previously undeclared here and
# left to the client's own @Value defaults, which made the port invisible to
# anyone reading this file.
deal-scoring:
  base-url: ${DEAL_SCORING_BASE_URL:http://127.0.0.1:8000}
  # A tree model answers in milliseconds; this only has to cover a cold start.
  request-timeout-ms: ${DEAL_SCORING_TIMEOUT_MS:10000}
# The stateful deal-state model (DealIntelligence_CRM/scripts/serve.py).
#
# BLANK BY DEFAULT, and blank means off. With no URL the deal flow keeps its
# previous behaviour — each meeting read on its own — instead of failing every
# submission on an installation that hasn't started the service.
#
# Set it to http://127.0.0.1:8002 once `python DealIntelligence_CRM/scripts/serve.py`
# is running. That turns on carry-forward: fields an earlier meeting established
# survive a later meeting that doesn't mention them, rather than reverting to a
# neutral default. Two of those fields are one-hot columns the scorer accepts
# silently, so the difference shows up as a wrong score, not an error.
#
# Timeout matches ai.request-timeout-ms: same 8B model, same generation cost.
deal-state:
  base-url: ${DEAL_STATE_BASE_URL:}
  request-timeout-ms: ${DEAL_STATE_TIMEOUT_MS:180000}
app:
  # Where OAuth sends the browser back to once sign-in completes.
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # Override via JWT_ACCESS_SECRET env var outside local dev.
    access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-please-override-in-prod-0123456789}
    access-ttl-minutes: 30
  refresh-token:
    ttl-days: 7
  email-ingestion:
    # Fill these in application-local.yml (gitignored, never commit real
    # credentials) — leaving username/password blank keeps the poller
    # disabled without crashing the app on startup.
    enabled: false
    host: imap.gmail.com
    port: 993
    username:
    password:
    poll-interval-ms: 120000
    # Which org inbound emails become leads for — a single shared mailbox
    # has no per-message tenant signal, so this is a fixed assumption for
    # v1 (one mailbox = one org). Find your org id via GET /api/auth/me.
    organization-id:
# Contract and proposal generation (the two SAP Build Process Automation bots).
# See docs/CONTRACT-GENERATION.md and docs/PROPOSAL-GENERATION.md.
#
# THIS FILE IS COMMITTED TO GIT -- no secrets below. Credentials are read from
# environment variables, or from application-local.yml (gitignored), which
# overrides everything here.
contract:
  # Which deal stages a contract may be generated from. The workflow's trigger
  # is "Proposal Accepted", which is not a stage this CRM has -- DealStages is a
  # fixed vocabulary shared with the frontend pipeline board -- so these are the
  # stages that mean the same thing here. Every value must be a real deal stage.
  #
  # PROPOSAL and NEGOTIATION are deliberately NOT in this list. Nothing in this
  # system reads the customer's reply to a proposal, so the rep advancing the
  # deal is the only record of what the customer said: Negotiation records that
  # the offer landed and is being discussed, Contract records that terms are
  # settled. Only the second justifies drafting an agreement -- with NEGOTIATION
  # eligible, a contract could go out while the price was still being argued.
  #
  # CLOSED_WON stays because reps legitimately drag straight there on a verbal
  # yes and then remember the paperwork; refusing that would be a 409 for
  # correct behaviour. CONTRACT is the intended trigger.
  eligible-stages: CONTRACT,CLOSED_WON
  # Render off the request thread. On by default because SAP Build Process
  # Automation abandons an HTTP call at 30 seconds and a cold generation takes
  # longer than that: POST /generate then answers 202 in about a second with the
  # contract DRAFTING, and the bot polls GET /{id}/status.
  #
  # false renders inline and answers 201 with the documents attached -- slower to
  # respond, but a render failure comes back as a 500 on the call that caused it
  # rather than as a status somebody has to go looking for.
  async-generation: ${CONTRACT_ASYNC_GENERATION:true}
  # Used when the caller supplies no end date.
  default-term-months: 12
  # Neither payment terms nor a delivery schedule is recorded anywhere in the
  # CRM, so they default from here and can be overridden per request.
  default-payment-terms: "50% on execution of this agreement, 50% on delivery. Invoices are payable within 30 days."
  default-delivery-timeline: "Within 30 days of the contract start date."
  # At or above this deal value a product sale is written as an enterprise
  # subscription rather than a one-off sale. In the deal's own currency.
  enterprise-value-threshold: 2500000
  templates:
    # A classpath: location uses the bundled templates; point this at a
    # directory to let an admin drop in their own without a rebuild.
    location: ${CONTRACT_TEMPLATE_LOCATION:classpath:contract-templates/}
  storage:
    # Generated DOCX and PDF files. The database stores paths relative to this,
    # so moving the store is a config change rather than a data migration.
    root: ${CONTRACT_STORAGE_ROOT:./var/contracts}
  libreoffice:
    # Set to false where LibreOffice is not installed: contracts then generate
    # as DOCX only and cannot be emailed to the customer.
    enabled: ${CONTRACT_LIBREOFFICE_ENABLED:true}
    # A bare name is resolved on PATH. On Windows this is usually
    # "C:/Program Files/LibreOffice/program/soffice.exe"; on macOS
    # "/Applications/LibreOffice.app/Contents/MacOS/soffice".
    path: ${CONTRACT_LIBREOFFICE_PATH:soffice}
    timeout-seconds: 120

# Proposal generation (Proposal Generation Bot). See docs/PROPOSAL-GENERATION.md.
#
# Storage and LibreOffice are not repeated here: proposals render through the
# same DocumentStorageService and PdfConversionService as contracts, so they are
# configured once, above, under `contract`. Only what differs lives here.
proposal:
  # Which deal stages a proposal may be generated from. Just PROPOSAL, and
  # narrower than the contract list on purpose -- this bot fires when a deal
  # *reaches* the proposal stage, whereas the contract bot fires on the later
  # "Proposal Accepted" outcome. Every value must be a real deal stage.
  eligible-stages: PROPOSAL
  # Render off the request thread. On by default because SAP Build Process
  # Automation abandons an HTTP call at 30 seconds and a cold generation takes
  # longer than that: POST /generate then answers 202 in about a second with the
  # proposal GENERATING, and the bot polls GET /{id}/status.
  async-generation: ${PROPOSAL_ASYNC_GENERATION:true}
  # How long a quotation stands when the caller supplies no expiry. This is why
  # proposals carry a validity and contracts carry a term: after this date the
  # pricing is no longer ours to honour.
  default-validity-days: 30
  # Neither payment terms nor a delivery schedule is recorded anywhere in the
  # CRM, so they default from here and can be overridden per request.
  default-payment-terms: "50% on acceptance of this proposal, 50% on delivery. Invoices are payable within 30 days."
  default-delivery-timeline: "Within 30 days of proposal acceptance."
  # At or above this deal value a product sale is proposed as an implementation
  # engagement rather than a straight quotation. In the deal's own currency.
  implementation-value-threshold: 2500000
  templates:
    # A classpath: location uses the bundled templates; point this at a
    # directory to let an admin drop in their own without a rebuild.
    location: ${PROPOSAL_TEMPLATE_LOCATION:classpath:proposal-templates/}

# Mailjet -- emails a contract to its customer (POST /api/contracts/{id}/send-email).
#
# The backend sends this itself rather than handing the PDF to SAP Build Process
# Automation, which cuts text values to 1,024 characters -- far short of a
# contract PDF in base64. SAP decides when; the backend sends.
#
# THIS FILE IS COMMITTED TO GIT -- keys belong in application-local.yml
# (gitignored) or environment variables. Blank keys or sender make send-email
# answer 503 rather than fail inside Mailjet.
# SAP Build Process Automation — the platform the lead validation bot runs on.
#
# OFF BY DEFAULT. With sap.process.enabled false the validation endpoints still
# answer, returning a pass with a warning, so lead capture behaves exactly as it
# did before this feature existed. Turning it on is a deliberate act and needs
# every value below.
#
# All of these come from a service key created against the Process Automation
# instance in the BTP cockpit. The secret belongs in application-local.yml or an
# environment variable, never here.
sap:
  process:
    enabled: ${SAP_PROCESS_ENABLED:false}
    token-url: ${SAP_TOKEN_URL:}
    client-id: ${SAP_CLIENT_ID:}
    client-secret: ${SAP_CLIENT_SECRET:}
    api-base-url: ${SAP_API_BASE_URL:}
    # The lead validation process, as its definition id appears in the platform.
    lead-validation-definition-id: ${SAP_LEAD_VALIDATION_DEFINITION_ID:}
    # The environment a deployed process lives in, where the platform needs
    # telling. Some landscapes answer "definition not found" without it; others
    # infer it from the service key. Blank sends no parameter.
    environment-id: ${SAP_ENVIRONMENT_ID:}
    # The trigger's API key, sent as irpa-api-key alongside the bearer token.
    # Required by tenants that scope calls per trigger; blank sends no header.
    api-key: ${SAP_API_KEY:}
    # The document bots, started when a deal reaches the stage that calls for
    # one. Blank means that stage starts nothing and the document is generated
    # by hand, which is how this ships: wiring a bot to a stage is a deliberate
    # act, not a consequence of filling in the platform credentials above.
    proposal-definition-id: ${SAP_PROPOSAL_DEFINITION_ID:}
    contract-definition-id: ${SAP_CONTRACT_DEFINITION_ID:}
    # The opportunity bot, which converts a lead the scoring model has called
    # HOT. Blank means the CRM converts leads itself, as it did before the bot.
    opportunity-definition-id: ${SAP_OPPORTUNITY_DEFINITION_ID:}
    # The meeting scheduler bot, which emails a lead the invitation to a
    # meeting a representative booked. Blank means the meeting is booked and
    # nobody is told.
    # Two scheduler bots, because the two invitations say different things: one
    # welcomes an enquiry to a first conversation, the other discusses a deal
    # that already exists. Which runs is decided by whether the lead has been
    # converted. Blank means a meeting of that kind is booked and nobody told.
    meeting-scheduler-definition-id: ${SAP_MEETING_SCHEDULER_DEFINITION_ID:}
    deal-meeting-scheduler-definition-id: ${SAP_DEAL_MEETING_SCHEDULER_DEFINITION_ID:}
    # The welcome bot, which emails a lead when one is captured. Blank means
    # no welcome is sent -- an email to a customer should not start happening
    # because the platform credentials above were filled in.
    lead-welcome-definition-id: ${SAP_LEAD_WELCOME_DEFINITION_ID:}
    # What each process calls its recipient inputs. The platform matches
    # context keys against the declared inputs exactly, so these have to be
    # whatever the deployed process says -- which is the process author's
    # choice, and not always the obvious spelling.
    contract-recipient-name-key: ${SAP_CONTRACT_RECIPIENT_NAME_KEY:recipientname}
    contract-recipient-email-key: ${SAP_CONTRACT_RECIPIENT_EMAIL_KEY:recipientemail}
    proposal-recipient-name-key: ${SAP_PROPOSAL_RECIPIENT_NAME_KEY:recipientname}
    proposal-recipient-email-key: ${SAP_PROPOSAL_RECIPIENT_EMAIL_KEY:recipientemail}
    # How long a representative waits before the lead is allowed through
    # unchecked. A validation service that is slow must not stop lead capture.
    #
    # Forty-five seconds because the measured runs need it. The automation
    # makes three round trips back into this CRM — sign in, report progress,
    # ask about duplicates — and a sign-in alone costs about three seconds of
    # password hashing before the tunnel is counted. Twenty seconds was set
    # before any of that was measured, and it expired on runs that went on to
    # succeed, which wastes the check rather than protecting the
    # representative from it.
    validation-timeout: ${SAP_VALIDATION_TIMEOUT:45s}
    # How often the backend asks whether the process has finished.
    poll-interval: ${SAP_POLL_INTERVAL:2s}
    request-timeout: ${SAP_REQUEST_TIMEOUT:10s}

mailjet:
  base-url: https://api.mailjet.com
  api-key: ${MAILJET_API_KEY:}
  secret-key: ${MAILJET_SECRET_KEY:}
  # Must be a sender address verified in the Mailjet account.
  from-email: ${MAILJET_FROM_EMAIL:}
  from-name: ${MAILJET_FROM_NAME:}
  request-timeout-ms: 30000
  templates:
    # Subject, HTML and plain-text wording, read on every send so they can be
    # edited while the backend runs. Relative to the directory the backend is
    # started from. See email-templates/README.md.
    location: ${MAILJET_TEMPLATE_LOCATION:file:./email-templates/}

# Which provider delivers customer email (contract and proposal PDFs).
#
#   mailjet  the Mailjet REST API above -- the default, so nothing changes until
#            this is switched on purpose
#   smtp     an SMTP server -- the college Google Workspace mailbox, via
#            smtp.gmail.com, logging in with an app password
#
# Switching is this one setting and a restart. The endpoints SAP calls, the
# templates and the PDFs are the same either way.
#
# THIS FILE IS COMMITTED TO GIT -- the password belongs in application-local.yml
# (gitignored) or the SMTP_PASSWORD environment variable, never here.
email:
  provider: ${EMAIL_PROVIDER:mailjet}
  smtp:
    host: ${SMTP_HOST:smtp.gmail.com}
    # 587 with STARTTLS. For 465, set ssl: true as well.
    port: ${SMTP_PORT:587}
    ssl: ${SMTP_SSL:false}
    # The full mailbox address, e.g. your-id@ritindia.edu
    username: ${SMTP_USERNAME:}
    # Gmail: the 16-character app password, spaces removed. Not the account password.
    password: ${SMTP_PASSWORD:}
    # Blank sends from the username. Gmail will not send as another address
    # unless it is a verified alias of the mailbox.
    from-email: ${SMTP_FROM_EMAIL:}
    from-name: ${SMTP_FROM_NAME:TechCRM}
    # Per connect, read and write. Must stay well under the 30 seconds after
    # which SAP Build Process Automation abandons the send-email call.
    timeout: ${SMTP_TIMEOUT:10s}
